name: Flutter match-card checks

on:
  push:
    branches: [master, fix-live-status-transition]
  pull_request:
    branches: [master]

jobs:
  analyze-match-card:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze match card
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/widgets/match_card.dart
